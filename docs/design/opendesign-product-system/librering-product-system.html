<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="oklch(0.9585 0.0098 87.47)">
  <title>LibreRing Product System</title>
  <style>
    :root {
      --bg: oklch(0.9585 0.0098 87.47);
      --surface: oklch(0.9132 0.0058 84.57);
      --surface-soft: oklch(0.935 0.007 86);
      --fg: oklch(0.2034 0.0058 106.91);
      --muted: oklch(0.4958 0.0112 93.69);
      --border: oklch(0.8518 0.0101 87.48);
      --accent: oklch(0.5973 0.1511 33.88);
      --accent-ink: oklch(0.47 0.13 33.88);
      --danger: oklch(0.43 0.13 28);
      --control-border: oklch(from var(--muted) calc(l + 0.08) c h);
      --font-display: "Helvetica Neue", "Neue Haas Grotesk Text Pro", "Nimbus Sans Narrow", sans-serif;
      --font-body: "Helvetica Neue", "Nimbus Sans", sans-serif;
      --font-mono: "SFMono-Regular", "SF Mono", "IBM Plex Mono", monospace;
      --radius: 16px;
      --control-radius: 12px;
      --ease: cubic-bezier(0.2, 0, 0, 1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--surface); color: var(--fg); font-family: var(--font-body); }
    body { overflow-x: hidden; }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; }
    button:active { transform: translateY(1px); }
    .skip-link { position: fixed; top: 8px; left: 8px; z-index: 10; padding: 10px 14px; color: var(--bg); background: var(--fg); border-radius: 8px; transform: translateY(-150%); }
    .skip-link:focus { transform: translateY(0); }
    .stage { min-height: 100dvh; display: grid; place-items: center; padding: 32px; }
    .phone { position: relative; width: 390px; height: 844px; max-height: calc(100dvh - 64px); overflow: hidden; background: var(--bg); border: 1px solid oklch(from var(--border) calc(l - 0.04) c h); border-radius: 34px; box-shadow: 0 24px 72px oklch(0.2 0.01 90 / 0.16); }
    .status-bar { height: 27px; padding: 9px 24px 0; display: flex; justify-content: space-between; color: var(--muted); font-size: 10px; font-weight: 600; letter-spacing: 0.02em; }
    .app-header { height: 58px; padding: 7px 24px 9px; display: flex; align-items: center; justify-content: space-between; }
    .wordmark { min-height: 44px; padding: 0; color: var(--fg); background: transparent; border: 0; font-family: var(--font-display); font-size: 19px; font-weight: 600; letter-spacing: -0.02em; }
    .sync-button { min-height: 44px; padding: 0 2px; color: var(--muted); background: transparent; border: 0; font-size: 11px; letter-spacing: 0.02em; }
    .sync-button:hover { color: var(--fg); }
    .screen { position: absolute; inset: 85px 0 78px; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
    .screen::-webkit-scrollbar { display: none; }
    .view { min-height: 100%; padding: 13px 24px 42px; animation: view-in 240ms var(--ease) both; }
    .app-nav { position: absolute; z-index: 3; left: 16px; right: 16px; bottom: 13px; height: 58px; padding: 5px; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--fg); border-radius: 18px; }
    .app-nav button { position: relative; min-width: 0; min-height: 48px; padding: 0 3px; color: oklch(0.84 0.008 88); background: transparent; border: 0; border-radius: 13px; font-size: 11px; font-weight: 550; letter-spacing: 0.02em; }
    .app-nav button[aria-current="page"] { color: var(--bg); background: transparent; }
    .app-nav button[aria-current="page"]::after { content: ""; position: absolute; left: 50%; bottom: 4px; width: 18px; height: 2px; background: var(--bg); transform: translateX(-50%); }
    .app-nav button:hover { color: var(--bg); }
    .app-nav button:focus-visible { outline-color: var(--bg); outline-offset: -2px; }
    h1, h2, h3, h4, p { margin-top: 0; }
    h1, h2, h3 { font-family: var(--font-display); }
    h1 { margin-bottom: 0; font-size: 36px; font-weight: 400; line-height: 1.04; letter-spacing: -0.025em; text-wrap: balance; }
    h2 { margin-bottom: 0; font-size: 25px; font-weight: 550; line-height: 1.1; letter-spacing: -0.02em; }
    h3 { margin-bottom: 0; font-size: 17px; font-weight: 600; line-height: 1.25; letter-spacing: -0.01em; }
    h4 { margin-bottom: 0; font-size: 13px; font-weight: 600; line-height: 1.35; }
    .highlight { color: var(--accent-ink); }
    .eyebrow { margin-bottom: 10px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
    .context { margin-bottom: 8px; color: var(--muted); font-size: 12px; line-height: 1.5; letter-spacing: 0.01em; }
    .body { max-width: 36ch; margin: 14px 0 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .back { min-height: 44px; margin: -8px 0 12px; padding: 0; color: var(--muted); background: transparent; border: 0; font-size: 12px; font-weight: 600; text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 5px; }
    .back:hover { color: var(--fg); text-decoration-color: var(--fg); }
    .hero-grid { display: grid; grid-template-columns: minmax(0, 1fr) 78px; gap: 18px; align-items: start; }
    .hero-score { padding-top: 25px; text-align: right; border-top: 1px solid var(--fg); }
    .hero-score strong, .score-value, .metric-value { display: block; font-family: var(--font-display); font-weight: 300; line-height: 0.9; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
    .hero-score strong { font-size: 64px; }
    .hero-score span, .score-caption { display: block; margin-top: 7px; color: var(--muted); font-size: 10px; letter-spacing: 0.03em; }
    .baseline-button { width: 100%; min-height: 80px; margin-top: 30px; padding: 17px 0; color: var(--fg); background: transparent; border: 1px solid var(--border); border-inline: 0; text-align: left; }
    .baseline-button:hover { background: var(--surface-soft); border-color: var(--fg); }
    .baseline-meta, .section-head, .row-main, .data-quality, .form-split { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .baseline-meta strong { font-size: 13px; font-weight: 600; }
    .baseline-meta span { color: var(--muted); font-size: 11px; }
    .baseline-chart { position: relative; height: 17px; margin: 14px 0 7px; background: var(--surface-soft); }
    .baseline-range { position: absolute; inset: 0 auto 0 66%; width: 18%; background: var(--surface); border-inline: 1px solid var(--border); }
    .baseline-marker { position: absolute; top: -3px; bottom: -3px; left: 88%; width: 3px; background: var(--accent); }
    .baseline-axis { display: flex; justify-content: space-between; color: var(--muted); font-size: 9px; letter-spacing: 0.01em; }
    .why { padding: 22px 0 18px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: end; }
    .why p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .text-action { min-height: 44px; padding: 0; color: var(--fg); background: transparent; border: 0; font-size: 12px; font-weight: 600; text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 5px; white-space: nowrap; }
    .text-action:hover { text-decoration-color: var(--fg); }
    .primary-action, .secondary-action { min-height: 50px; padding: 0 18px; border-radius: var(--control-radius); font-size: 14px; font-weight: 600; letter-spacing: 0.02em; white-space: nowrap; }
    .primary-action { color: var(--bg); background: var(--fg); border: 1px solid var(--fg); }
    .primary-action:hover { color: var(--fg); background: var(--bg); }
    .secondary-action { color: var(--fg); background: transparent; border: 1px solid var(--control-border); }
    .secondary-action:hover { border-color: var(--fg); background: var(--surface-soft); }
    .full { width: 100%; }
    .story { margin-top: 8px; padding: 15px 0; display: grid; grid-template-columns: 66px 1fr; gap: 14px; border-top: 1px solid var(--border); }
    .story time { color: var(--muted); font-size: 10px; }
    .story p { margin: 0; font-size: 13px; line-height: 1.45; }
    .today-action { margin-top: 15px; }
    .link-row { width: 100%; min-height: 62px; padding: 12px 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; color: var(--fg); background: transparent; border: 0; border-bottom: 1px solid var(--border); text-align: left; }
    .link-row:hover { border-color: var(--fg); }
    .link-row strong { display: block; font-size: 13px; font-weight: 600; }
    .link-row small { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; line-height: 1.4; }
    .link-row > span:last-child { color: var(--muted); font-size: 11px; text-align: right; }
    .score-lead { margin-top: 24px; padding: 18px 0; display: grid; grid-template-columns: 84px 1fr; gap: 20px; align-items: end; border-block: 1px solid var(--border); }
    .score-value { font-size: 62px; }
    .score-lead p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .section { margin-top: 28px; }
    .section-head { margin-bottom: 12px; }
    .section-head span { color: var(--muted); font-size: 10px; }
    .contributor { min-height: 66px; padding: 10px 0; display: grid; grid-template-columns: 102px minmax(0, 1fr) 54px; gap: 12px; align-items: center; }
    .contributor + .contributor { border-top: 1px solid var(--border); }
    .contributor strong { font-size: 12px; }
    .contributor small { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; line-height: 1.35; }
    .signal { position: relative; height: 12px; }
    .signal::before { content: ""; position: absolute; top: 5px; left: 0; right: 0; height: 1px; background: var(--border); }
    .signal i { position: absolute; top: 1px; left: var(--point); width: 3px; height: 10px; background: var(--fg); }
    .contributor output { color: var(--muted); font-size: 10px; text-align: right; }
    .guidance-block { margin-top: 24px; padding: 18px; background: var(--surface); border-radius: var(--radius); }
    .guidance-block p { margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .data-quality { margin-top: 12px; color: var(--muted); font-size: 9px; }
    .sleep-total { margin-top: 22px; padding-bottom: 20px; display: grid; grid-template-columns: 1fr auto; align-items: end; border-bottom: 1px solid var(--border); }
    .sleep-total strong { font-family: var(--font-display); font-size: 62px; font-weight: 300; line-height: 0.9; letter-spacing: -0.04em; }
    .sleep-total span { color: var(--muted); font-size: 11px; line-height: 1.5; text-align: right; }
    .sleep-chart { position: relative; margin-top: 16px; display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 9px; border-radius: 8px; }
    .sleep-chart:focus-within { outline: 2px solid var(--accent-ink); outline-offset: 4px; }
    .sleep-stage-labels { height: 102px; display: grid; grid-template-rows: repeat(4, 1fr); align-items: center; color: var(--muted); font-size: 9px; letter-spacing: 0.01em; }
    .sleep-stage-plot { position: relative; height: 102px; touch-action: pan-y; cursor: ew-resize; }
    .sleep-gridline { position: absolute; left: 0; right: 0; top: calc(var(--row) * 25% + 12px); height: 1px; background: var(--border); }
    .sleep-segment { position: absolute; z-index: 1; top: calc(var(--row) * 25% + 5px); left: var(--start); width: max(var(--duration), 2px); height: 14px; background: var(--border); border-inline-end: 1px solid var(--bg); }
    .sleep-segment.awake { background: oklch(from var(--border) calc(l + 0.03) c h); }
    .sleep-segment.light { background: var(--border); }
    .sleep-segment.deep { background: oklch(from var(--border) calc(l - 0.11) c h); }
    .sleep-segment.rem { background: var(--accent); }
    .sleep-scrub-line { position: absolute; z-index: 2; top: 0; bottom: 0; left: var(--scrub, 12.3%); width: 1px; background: var(--fg); pointer-events: none; }
    .sleep-scrub-line::before { content: ""; position: absolute; top: -3px; left: -3px; width: 7px; height: 7px; background: var(--fg); border-radius: 50%; }
    .sleep-scrubber { position: absolute; z-index: 3; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize; }
    .sleep-axis { margin: 7px 0 0 51px; display: flex; justify-content: space-between; color: var(--muted); font-size: 9px; font-variant-numeric: tabular-nums; }
    .sleep-readout { min-height: 58px; margin-top: 13px; padding: 11px 0; display: grid; grid-template-columns: 1fr auto; gap: 3px 14px; align-items: baseline; border-block: 1px solid var(--border); }
    .sleep-readout strong { font-size: 13px; font-weight: 600; }
    .sleep-readout span { font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; }
    .sleep-readout small { grid-column: 1 / -1; color: var(--muted); font-size: 10px; line-height: 1.4; }
    .stage-grid { margin-top: 14px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px 20px; }
    .stage-stat { min-height: 48px; padding: 10px 0; display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--border); }
    .stage-stat strong { font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .stage-stat span { color: var(--muted); font-size: 10px; }
    .bar-chart { position: relative; height: 132px; margin-top: 17px; padding: 0 2px 19px; display: grid; grid-template-columns: repeat(var(--columns), 1fr); gap: 4px; align-items: end; border-bottom: 1px solid var(--border); }
    .bar-chart .band { position: absolute; left: 0; right: 0; bottom: 47px; height: 34px; background: var(--surface-soft); border-block: 1px solid var(--border); }
    .bar-chart i { position: relative; z-index: 1; min-width: 3px; height: var(--height); background: var(--fg); }
    .bar-chart i.accent { background: var(--accent); }
    .line-chart { height: 142px; margin-top: 17px; border-bottom: 1px solid var(--border); }
    .line-chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .line-baseline { fill: var(--surface-soft); }
    .line-area { fill: oklch(from var(--fg) l c h / 0.07); }
    .line-path { fill: none; stroke: var(--fg); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .line-last { fill: var(--accent); stroke: var(--bg); stroke-width: 2; vector-effect: non-scaling-stroke; }
    .heart-chart { height: 176px; margin-top: 17px; border-bottom: 1px solid var(--border); }
    .heart-chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .heart-window { fill: var(--surface); }
    .heart-window-edge { stroke: var(--border); stroke-width: 1; vector-effect: non-scaling-stroke; }
    .heart-gap { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 4; vector-effect: non-scaling-stroke; }
    .data-chart { position: relative; padding-top: 1px; border-radius: 8px; }
    .data-chart:focus-within { outline: 2px solid var(--accent-ink); outline-offset: 4px; }
    .chart-scrub-line { position: absolute; z-index: 4; top: 17px; bottom: 0; left: var(--chart-scrub, 100%); width: 1px; background: var(--fg); pointer-events: none; }
    .chart-scrub-line::before { content: ""; position: absolute; top: -3px; left: -3px; width: 7px; height: 7px; background: var(--fg); border-radius: 50%; }
    .chart-scrubber { position: absolute; z-index: 5; inset: 17px 0 0; width: 100%; height: calc(100% - 17px); margin: 0; opacity: 0; cursor: ew-resize; touch-action: pan-y; }
    .chart-readout { min-height: 49px; padding: 9px 0; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: baseline; border-bottom: 1px solid var(--border); }
    .chart-readout strong { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .chart-readout span { color: var(--muted); font-family: var(--font-mono); font-size: 10px; font-variant-numeric: tabular-nums; }
    .chart-readout small { grid-column: 1 / -1; color: var(--muted); font-size: 9px; line-height: 1.4; }
    .chart-axis { margin-top: 7px; display: flex; justify-content: space-between; color: var(--muted); font-size: 9px; }
    .daily-chart { height: 174px; margin-top: 17px; border-bottom: 1px solid var(--border); }

    .daily-divider { stroke: var(--border); stroke-width: 1; vector-effect: non-scaling-stroke; }
    .movement-bar { fill: var(--border); }
    .timeline-summary { margin-top: 20px; display: grid; grid-template-columns: repeat(3, 1fr); border-block: 1px solid var(--border); }

    .timeline-event strong { display: block; font-size: 12px; font-weight: 600; }
    .timeline-event small { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; line-height: 1.35; }
    .timeline-event > span:last-child { color: var(--muted); font-size: 9px; text-align: right; }
    .activity-record-meta { margin-top: 22px; display: grid; grid-template-columns: repeat(3, 1fr); border-block: 1px solid var(--border); }
    .activity-record-meta > div { min-width: 0; padding: 14px 10px; }

    .activity-record-meta > div:last-child { padding-right: 0; }
    .activity-record-meta > div + div { border-left: 1px solid var(--border); }
    .activity-record-meta strong { display: block; font-size: 12px; font-weight: 600; line-height: 1.35; }
    .activity-record-meta span { display: block; margin-top: 4px; color: var(--muted); font-size: 9px; line-height: 1.35; }
    .evidence-list { margin-top: 9px; border-top: 1px solid var(--border); }

    .vital-reading b { display: block; font-family: var(--font-display); font-size: 19px; font-weight: 400; letter-spacing: -0.02em; }
    .vital-reading span { color: var(--muted); font-size: 9px; }

          navigate("activity-detail");
        }
        else if (name === "journal") showSheet("Travel context", "You recorded that travel ended 19 days ago. Context may be shown beside trends, but LibreRing does not claim it caused the change.", [["Source", "User-entered"], ["Visibility", "Private"], ["Trend use", "Context only"]]);
        else if (name === "about") showSheet("Open-source product", "LibreRing is designed for inspectable methods, portable data, and honest hardware boundaries. The prototype does not represent a released medical device.", [["Licence", "Open source"], ["Data", "Portable"], ["Claims", "Wellness only"]]);
        else if (name === "retention") showSheet("Retention", "The current product direction keeps local history until you change the setting or delete it.", [["Current setting", "Keep all"], ["Cloud copy", "None"]]);
        else if (name === "delete") showSheet("Delete local health data", "This action would permanently remove local health history in production. This design prototype will not delete project files or health records.", null);
        else if (name === "export") { showToast("Export prepared as a prototype action."); }
        else if (name === "start-manual") { state.activityDraftSource = "Manual"; navigate("sports"); }
        else if (name === "confirm-suggestion") {
          state.manualActivity = { sport: "Running", duration: "34", date: "2026-08-28", intensity: "Moderate", source: "Confirmed suggestion" };
          state.suggestionDismissed = true;
          state.activityDraftSource = "Manual";
          write("librering-manual-activity", JSON.stringify(state.manualActivity));
          write("librering-suggestion-dismissed", "true");
          navigate("activity");
          showToast("Running saved after your confirmation.");
        }
        else if (name === "choose-suggestion-sport") { state.activityDraftSource = "Confirmed suggestion"; navigate("sports"); }
        else if (name === "dismiss-suggestion") { state.suggestionDismissed = true; state.activityDraftSource = "Manual"; write("librering-suggestion-dismissed", "true"); navigate("activity"); showToast("Suggestion dismissed. Nothing was saved."); }
        else if (name === "choose-sport") { state.sport = action.dataset.sport; write("librering-selected-sport", state.sport); navigate("log-sport"); }
        else if (name === "set-range") { state.range = action.dataset.range; write("librering-trend-range", state.range); render(); }
        else if (name === "sync-now" || name === "retry-sync") { window.clearTimeout(syncTimer); state.sync = "loading"; state.route = "device"; render(); syncTimer = window.setTimeout(function () { state.sync = "complete"; render(); showToast("Sync complete. No gaps found."); }, 1100); }
        else if (name === "enable-cycle") showSheet("Enable cycle features", "Cycle and reproductive context requires separate consent. LibreRing will not infer pregnancy, fertility, or medical conditions.", [["Collection", "User-entered context"], ["Temperature", "Unavailable on this ring"], ["Control", "Can be disabled anytime"]], { name: "confirm-cycle", label: "Give consent and enable" });
        else if (name === "confirm-cycle") { state.cycle = true; write("librering-cycle-consent", "true"); closeSheet(); render(); showToast("Cycle features enabled."); }
        else if (name === "disable-cycle") { state.cycle = false; write("librering-cycle-consent", "false"); render(); showToast("Cycle features disabled."); }
        else if (name === "onboarding-next") { if (state.onboardingStep < 3) { state.onboardingStep += 1; write("librering-onboarding-step", state.onboardingStep); render(); } else { state.onboardingStep = 1; write("librering-onboarding-step", 1); navigate("today"); } }
      });
      document.addEventListener("input", function (event) {
        if (event.target.id === "sleep-scrubber") { updateSleepScrub(event.target.value); return; }
        if (event.target.matches("[data-chart-scrubber]")) { updateChartScrub(event.target); return; }
        if (event.target.id !== "sport-search") return;
        const query = event.target.value;
        const results = document.getElementById("sport-results");
        if (!results) return;
        const fresh = document.createElement("div");
        fresh.innerHTML = sportsView(query);
        const next = fresh.querySelector("#sport-results");
        results.innerHTML = next ? next.innerHTML : "";
      });
      function handleSleepPointer(event) {
        const plot = event.target.closest ? event.target.closest(".sleep-stage-plot") : null;
        if (!plot || (event.type === "pointermove" && event.pointerType !== "mouse" && event.buttons !== 1)) return;
        const input = plot.querySelector("#sleep-scrubber");
        if (!input) return;
        const box = plot.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, (event.clientX - box.left) / Math.max(1, box.width)));
        input.value = String(Math.round(ratio * 529));
        updateSleepScrub(input.value);
      }
      document.addEventListener("pointerdown", handleSleepPointer);
      document.addEventListener("pointermove", handleSleepPointer);
      function handleChartPointer(event) {
        const chart = event.target.closest ? event.target.closest(".data-chart") : null;
        if (!chart || (event.type === "pointermove" && event.pointerType !== "mouse" && event.buttons !== 1)) return;
        const input = chart.querySelector("[data-chart-scrubber]");
        if (!input) return;
        const box = chart.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, (event.clientX - box.left) / Math.max(1, box.width)));
        const positions = JSON.parse(chart.dataset.chartPositions || "[]");
        if (positions.length === Number(input.max) + 1) {
          const target = ratio * 100;
          let closestIndex = 0;
          positions.forEach(function (position, index) { if (Math.abs(Number(position) - target) < Math.abs(Number(positions[closestIndex]) - target)) closestIndex = index; });
          input.value = String(closestIndex);
        } else input.value = String(Math.round(ratio * Number(input.max)));
        updateChartScrub(input);
      }
      document.addEventListener("pointerdown", handleChartPointer);
      document.addEventListener("pointermove", handleChartPointer);
      document.addEventListener("submit", function (event) {
        if (event.target.id === "profile-form") {
          event.preventDefault();
          const name = event.target.elements.name;
          if (!name.value.trim()) { name.setCustomValidity("Enter a display name."); name.reportValidity(); return; }
          if (name.value.trim().length > 40) { name.setCustomValidity("Use 40 characters or fewer."); name.reportValidity(); return; }
          name.setCustomValidity("");
          state.profileName = name.value.trim();
          state.units = event.target.elements.units.value;
          state.focus = event.target.elements.focus.value;
          state.notifications = event.target.elements.notifications.value;
          write("librering-profile-name", state.profileName);
          write("librering-profile-units", state.units);
          write("librering-profile-focus", state.focus);
          write("librering-profile-notifications", state.notifications);
          showToast("Preferences saved locally.");
          navigate("you");
          return;
        }
        if (event.target.id !== "activity-form") return;
        event.preventDefault();
        const duration = event.target.elements.duration;
        if (!duration.value || Number(duration.value) < 1) { duration.setCustomValidity("Enter at least one minute."); duration.reportValidity(); return; }
        duration.setCustomValidity("");
        const customName = event.target.elements.customName;
        if (customName && !customName.value.trim()) { customName.setCustomValidity("Name the activity."); customName.reportValidity(); return; }
        if (customName) customName.setCustomValidity("");
        const savedSport = customName ? customName.value.trim() : state.sport;
        const source = state.activityDraftSource === "Confirmed suggestion" ? "Confirmed suggestion" : "Manual";
        state.manualActivity = { sport: savedSport, duration: duration.value, date: event.target.elements.date.value, intensity: event.target.elements.intensity.value, source: source };
        if (source === "Confirmed suggestion") { state.suggestionDismissed = true; write("librering-suggestion-dismissed", "true"); }
        state.activityDraftSource = "Manual";
        write("librering-manual-activity", JSON.stringify(state.manualActivity));
        showToast(savedSport + (source === "Confirmed suggestion" ? " saved after your confirmation." : " saved as a manual activity."));
        navigate("activity");
      });
      sheet.addEventListener("click", function (event) {
        const box = sheet.getBoundingClientRect();
        if (event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom) closeSheet();
      });
      window.addEventListener("hashchange", function () { const route = hashRoute(); if (routeParents[route]) { state.route = route; render(); } });
      render();
    }());
  </script>
</body>
</html>
