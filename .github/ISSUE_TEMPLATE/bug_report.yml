name: Bug report
description: Report reproducible LibreRing behaviour without sharing private data.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Thank you. Please redact health readings, location, device identifiers, raw BLE captures, credentials, and signing information.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the expected and observed behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open…\n2. Tap…\n3. Observe…"
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: LibreRing version or commit
      placeholder: 1.2.0 (10) or commit SHA
  - type: input
    id: platform
    attributes:
      label: Phone and OS
      placeholder: iPhone model / iOS version or Android model / Android version
  - type: input
    id: ring
    attributes:
      label: Ring model and firmware
      description: No serial number, MAC address, or Bluetooth identifier.
      placeholder: COLMI R12 / firmware version
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs or screenshots
      description: Attach only if they contain no private or identifying data.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal health data, location, stable identifiers, raw captures, credentials, and signing information.
          required: true
