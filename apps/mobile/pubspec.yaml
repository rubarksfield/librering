  ring_demo:
    path: ../../packages/ring_demo
  ring_design_system:
    path: ../../packages/ring_design_system

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
